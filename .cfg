global
    log stdout format raw local0
    maxconn 64

defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client 10s
    timeout server 10s

frontend web_metrics
    bind *:9301
    http-request deny unless { path -i /metrics }
    default_backend web_metrics_backend

backend web_metrics_backend
    server web 172.31.251.30:9301 check

frontend repo_metrics
    bind *:9302
    http-request deny unless { path -i /metrics }
    default_backend repo_metrics_backend

backend repo_metrics_backend
    server repo 172.31.251.60:9302 check
